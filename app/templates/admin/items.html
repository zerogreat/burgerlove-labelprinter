{% extends "base.html" %}
{% block content %}
<div class="admin">
  <nav class="admin-nav">
    <a href="/">Print Screen</a>
    <a href="/admin/items">Items</a>
    <a href="/admin/log">Print log</a>
    <a href="/admin/export.csv">Export CSV</a>
    <form method="post" action="/admin/logout" class="inline-form"><button type="submit">Log out</button></form>
  </nav>
  <h1>Food Items</h1>
  <a class="button" href="/admin/items/new">+ New item</a>
  <table>
    <thead>
      <tr><th></th><th>Name</th><th>Shelf life (days)</th><th></th></tr>
    </thead>
    <tbody>
      {% for item in items %}
      <tr>
        <td>{% if item.photo_path %}<img class="thumb" src="/photos/{{ item.photo_path }}" alt="">{% endif %}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.shelf_life_days or "—" }}</td>
        <td>
          <div class="row-actions">
            <a class="icon-btn icon-btn-edit" href="/admin/items/{{ item.id }}/edit" aria-label="Edit {{ item.name }}" title="Edit">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
              </svg>
            </a>
            <form method="post" action="/admin/items/{{ item.id }}/delete" class="inline-form" onsubmit="return confirm('Delete {{ item.name }}?')">
              <button type="submit" class="icon-btn icon-btn-delete" aria-label="Delete {{ item.name }}" title="Delete">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 6h18"/>
                  <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                  <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                  <line x1="10" y1="11" x2="10" y2="17"/>
                  <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
              </button>
            </form>
          </div>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4">No items yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
